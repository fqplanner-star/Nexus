<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c1b">
<title>NEXUS · Aprende lo que quieras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0c1b; --card:#14172e; --ink:#eef0ff; --muted:#9ea5cc; --line:#2a2f55;
  --green:#2ee6a6; --green-d:#16996d; --green-s:#0f3b36;
  --red:#ff6178; --red-d:#b8354a; --red-s:#41192c;
  --blue:#38c8ff; --blue-d:#1b7fab; --blue-s:#142c4d;
  --violet:#8b6cff; --violet-d:#5a3fd1; --gold:#ffca55; --gold-d:#b9862a;
  --grad:linear-gradient(100deg,#8b6cff,#38c8ff 60%,#2ee6a6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,system-ui,sans-serif;min-height:100vh;background-color:var(--bg);
  background-image:radial-gradient(60rem 40rem at 10% -10%,rgba(139,108,255,.28),transparent 60%),radial-gradient(50rem 36rem at 100% 20%,rgba(56,200,255,.16),transparent 60%),radial-gradient(rgba(255,255,255,.09) 1px,transparent 1.5px);
  background-size:auto,auto,28px 28px;background-attachment:fixed;color:var(--ink);line-height:1.5;font-weight:500}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{border:0;background:none;font-weight:900;font-size:1.35rem;color:var(--violet);margin-right:auto}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;padding:4px 8px;border-radius:12px;white-space:nowrap}
.icon-btn{border:2px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;font-size:1.1rem}
@media(max-width:440px){.logo span{display:none}.stat{padding:4px}}

main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
.view{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h1{font-size:clamp(1.7rem,6vw,2.5rem);font-weight:900;line-height:1.15}
h2{font-size:1.35rem;font-weight:900;line-height:1.25}
h3{font-size:1.1rem;font-weight:800}
.muted{color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-top:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:12px 20px;font-weight:800;background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d);text-decoration:none;transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.btn:disabled{background:#d6dae5;box-shadow:0 4px 0 #bcc2d1;color:#7b8399}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.violet{background:var(--violet);box-shadow:0 4px 0 var(--violet-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row>*{flex:1 1 180px}

.field{width:100%;border:2px solid var(--line);border-radius:16px;padding:12px 14px;background:#fbfcfe}
.field:focus{border-color:var(--blue);outline:none}
label{display:block;font-weight:800;font-size:.85rem;margin:12px 0 4px}

.hero{text-align:center}
.hero .big{font-size:3.5rem;display:inline-block;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.chip:hover{border-color:var(--violet)}
.course{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px}
.course .emoji{font-size:2.2rem}
.course .open{flex:1;min-width:0;text-align:left;border:0;background:none}
.course .open strong{display:block;overflow-wrap:anywhere}
.track{height:14px;background:#e7e9f2;border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}

.module{margin-top:28px;border-radius:20px;padding:16px 20px;color:#fff;background:var(--violet)}
.module:nth-of-type(3n+2){background:var(--blue-d)}
.module:nth-of-type(3n){background:var(--green-d)}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0 4px}
.node-wrap{display:flex;flex-direction:column;align-items:center;max-width:210px;text-align:center}
.node{width:78px;height:70px;border-radius:50%;border:0;font-size:1.8rem;background:#dde0ea;box-shadow:0 7px 0 #c2c6d4;transition:transform .15s}
.node:not(:disabled):hover{transform:scale(1.06)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.current{background:var(--green);box-shadow:0 7px 0 var(--green-d);animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(76,185,5,.4)}50%{outline:10px solid rgba(76,185,5,.18)}}
.node-wrap small{margin-top:12px;font-weight:800;line-height:1.3}

.lesson-top{display:flex;align-items:center;gap:12px}
.lesson-top .track{flex:1}
ul.points{list-style:none;margin-top:14px}
ul.points li{background:var(--blue-s);border-radius:16px;padding:12px 16px;margin-top:10px}
ul.points b{display:block}
.media{margin-top:16px;border-radius:18px;overflow:hidden;background:#eceef6;aspect-ratio:2/1;position:relative;display:flex;align-items:center;justify-content:center;text-align:center}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#diagram{margin-top:16px;border:2px solid var(--line);border-radius:18px;padding:12px;overflow-x:auto;text-align:center}
#diagram svg{max-width:100%;height:auto}

.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
@media(max-width:520px){.options{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--card);padding:16px;font-weight:800;min-height:64px;overflow-wrap:anywhere}
.opt:hover:not(:disabled){background:var(--blue-s);border-color:var(--blue)}
.opt.sel{background:var(--blue-s);border-color:var(--blue)}
.opt.ok{background:var(--green-s);border-color:var(--green)}
.opt.bad{background:var(--red-s);border-color:var(--red);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sentence{font-size:1.2rem;font-weight:800;margin-top:16px}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--violet);text-align:center;color:var(--violet);padding:0 6px}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.bank .opt{min-height:0;padding:10px 16px}
.answer-zone{min-height:74px;border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;margin-top:16px}
.answer-zone .opt{min-height:0;padding:10px 14px;text-align:left}
.feedback{margin-top:18px;border-radius:20px;padding:16px 18px;animation:rise .25s ease}
.feedback.ok{background:var(--green-s);color:#245c00}
.feedback.bad{background:var(--red-s);color:#8c1620}

.overlay{position:fixed;inset:0;background:rgba(30,35,60,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:440px;max-height:92vh;overflow:auto;margin:0;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.state{text-align:center;padding:60px 10px}
.spinner{width:60px;height:60px;border:8px solid var(--line);border-top-color:var(--violet);border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.rewards div{border:2px solid var(--line);border-radius:18px;padding:12px;font-weight:900;font-size:1.2rem}
.rewards small{display:block;font-size:.75rem;color:var(--muted)}
.confetti{position:fixed;top:-12px;width:10px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}.confetti{display:none}}

/* ---------- Identidad NEXUS ---------- */
h1,h2,h3,.logo{font-family:'Space Grotesk',Manrope,system-ui,sans-serif;letter-spacing:-.01em}
header{background:rgba(10,12,27,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;color:var(--ink);letter-spacing:.18em;font-size:1.2rem;cursor:pointer}
.logo svg{width:30px;height:30px;flex:none}
.stat{background:rgba(255,255,255,.06);border-radius:999px}
.icon-btn{border:1px solid var(--line);background:rgba(255,255,255,.05)}
.card{background:linear-gradient(160deg,rgba(32,36,72,.92),rgba(18,21,43,.92));border:1px solid var(--line);box-shadow:0 18px 40px -24px #000}
.hero{padding:18px 0 8px}
.hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.orbit{width:190px;max-width:60%;margin-bottom:8px}
.orbit line{stroke:#5b62a8;stroke-width:1.5;stroke-dasharray:4 5;animation:flow 2s linear infinite}
.orbit circle{animation:glow 2.8s ease-in-out infinite}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes glow{50%{opacity:.55}}
.btn{background:var(--green);color:#06231a;box-shadow:0 4px 0 var(--green-d)}
.btn.primary{background:var(--grad);color:#08101f;box-shadow:0 8px 28px -8px rgba(56,200,255,.7)}
.btn.blue{background:var(--blue);color:#05202e}
.btn.red{color:#2b050c}
.btn.violet{color:#fff}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 0 #080a16}
.btn:disabled{background:#2a2f4d;color:#7d83a8;box-shadow:0 4px 0 #191c33}
.field{background:#0d1022;border:1px solid var(--line);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--violet);height:32px}
.count-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-weight:800}
.count-head output{font:700 1.6rem 'Space Grotesk',sans-serif;color:var(--blue)}
.chip{background:rgba(255,255,255,.04)}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
a{color:var(--blue)} a.btn.red{color:#2b050c}
.track{background:#252a4a;height:10px}
.track i{background:var(--grad)}
.course{transition:transform .2s,border-color .2s}
.course:hover{transform:translateY(-3px);border-color:var(--violet)}
.course .emoji{width:60px;height:60px;flex:none;display:grid;place-items:center;border-radius:18px;background:rgba(139,108,255,.18);font-size:2rem}
.course .open .track{margin-top:8px}
.module,.module:nth-of-type(n){background:linear-gradient(110deg,rgba(139,108,255,.35),rgba(56,200,255,.12));border:1px solid var(--line);color:var(--ink)}
.module div{color:var(--blue);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.14em}
.path{position:relative;gap:30px;padding-top:30px}
.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.links path{fill:none;stroke:#4a5296;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round}
.node-wrap{position:relative;z-index:1}
.node{width:74px;height:74px;background:#1d2140;border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.node.done{background:radial-gradient(circle at 35% 30%,#ffe6a8,var(--gold));border-color:var(--gold);box-shadow:0 0 26px -4px var(--gold)}
.node.current{background:linear-gradient(135deg,var(--violet),var(--blue));border-color:#fff;box-shadow:0 0 34px -2px var(--blue)}
.node-wrap small{background:var(--bg);border-radius:8px;padding:2px 8px}
ul.points li{background:rgba(56,200,255,.08);border-left:3px solid var(--blue)}
.media{background:#0d1022}
#diagram{background:#0d1022;border:1px solid var(--line)}
.opt{background:#1a1e3b;border:1px solid var(--line);border-bottom-width:4px;color:var(--ink)}
.opt.ok{background:var(--green-s);border-color:var(--green)}
.opt.bad{background:var(--red-s);border-color:var(--red)}
.opt.sel{background:var(--blue-s);border-color:var(--blue)}
.answer-zone{border:2px dashed var(--line)}
.feedback.ok{background:var(--green-s);color:#b9ffe4;border:1px solid var(--green-d)}
.feedback.bad{background:var(--red-s);color:#ffd3da;border:1px solid var(--red-d)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.match>div{display:grid;gap:10px;grid-auto-rows:1fr}
.match .opt{padding:12px 10px}
.sort-item{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.03)}
.sort-item span{flex:1 1 160px;font-weight:800}
.sort-item .opt{min-height:0;padding:8px 12px}
.overlay{background:rgba(4,5,14,.75);backdrop-filter:blur(6px)}
.spinner{border-color:var(--line);border-top-color:var(--blue)}
.rewards div{background:rgba(255,255,255,.04);border:1px solid var(--line)}
@media(max-width:480px){.bar{gap:4px;padding:10px 8px}.logo{font-size:.95rem;letter-spacing:.08em;gap:4px;padding:0}.logo svg{width:22px;height:22px}.bar .stat{padding:3px 5px;font-size:.85rem;gap:2px}.bar .icon-btn{min-width:32px;height:34px}}
@media(max-width:350px){.logo b{display:none}}

/* ---------- Imagen ---------- */
.media{aspect-ratio:16/10}
.media.loaded::before{content:"";position:absolute;inset:-20px;background:var(--shot) center/cover;filter:blur(18px) brightness(.5)}
.media img{object-fit:contain}
.cover{padding:12px;display:grid;justify-items:center;gap:8px;width:100%;height:100%;align-content:center;background:linear-gradient(135deg,rgba(139,108,255,.4),rgba(56,200,255,.15))}
.cover span{font-size:3rem;line-height:1}
.credit{font-size:.75rem;margin-top:6px;text-align:right}

/* ---------- Móvil ---------- */
button,a,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
h1,h2,h3{text-wrap:balance;overflow-wrap:anywhere}
header{padding-top:env(safe-area-inset-top)}
main{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
@media(hover:none){.course:hover{transform:none;border-color:var(--line)}.opt:hover:not(:disabled):not(.sel):not(.ok):not(.bad){background:#1a1e3b;border-color:var(--line)}}
@media(max-width:600px){
  body{background-attachment:scroll}
  main{padding-top:14px;padding-left:12px;padding-right:12px}
  .card{padding:16px;border-radius:20px}
  .hero{padding:0}
  .orbit{width:120px}
  .hero h1{font-size:1.7rem}
  .hero p{font-size:.92rem}
  #courseForm .row{flex-wrap:nowrap;gap:8px}
  #courseForm .row>*{flex:1 1 0;min-width:0}
  #courseForm select{padding:12px 8px}
  .count-head+input+.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .chip{min-height:40px}
  .chip.preset{padding:6px 2px;font-size:1rem}
  .preset .word{display:none}
  .module{margin-top:20px}
  .node-wrap{max-width:170px}
  .lesson-top{gap:8px}
  #startBtn,#checkBtn{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:5}
  #checkBtn:disabled{position:static}
  .match{gap:8px}
  .match .opt{font-size:.88rem;padding:10px 8px}
  .sort-item .opt{flex:1;min-height:44px}
  .rewards div{font-size:1rem;padding:10px 4px}
  .overlay{align-items:flex-end;padding:0}
  .modal{max-width:none;max-height:90vh;max-height:90dvh;border-radius:26px 26px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:rise .25s ease}
  .modal .row{flex-wrap:nowrap}
  .modal .row>*{flex:1 1 0;min-width:0;padding-left:8px;padding-right:8px}
}
button.stat{border:0;color:inherit}
.node.exam{border-radius:22px}
.helpers{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.helpers .chip:disabled:not(.on){opacity:.4}
.opt.gone{opacity:.25;text-decoration:line-through}
.item{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:16px}
.item .ico{font-size:1.7rem}
.item div{flex:1;min-width:0}
.item small{display:block;color:var(--muted);line-height:1.35}
.item .btn{padding:8px 10px;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0;text-align:center}
.week div{border:1px solid var(--line);border-radius:12px;padding:6px 0;font-size:1.1rem}
.week small{display:block;color:var(--muted);font-size:.7rem}
.week .today{border-color:var(--gold)}
@media(max-width:480px){.bar .stat{font-size:.8rem;padding:3px 4px}}
@media(max-width:420px){.logo b{display:none}}
@media(min-width:381px) and (max-width:420px){.logo b{display:inline}.logo svg{display:none}}
.node.partial{background:#1673e6;border-color:#7cc4ff;box-shadow:0 0 24px -6px #3b9cff}
.node.current{background:linear-gradient(135deg,#8b6cff,#e45bd0);box-shadow:0 0 34px -2px #b366ee}
.legend{font-size:.82rem;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 5px 0 8px}
.dot.gold{background:var(--gold);margin-left:0}.dot.blue{background:#1673e6}
summary{cursor:pointer;font-weight:800;color:var(--muted)}
#testOut p{font-size:.9rem;margin-top:6px}
</style>
</head>
<body>

  <div class="bar">

<script>
"use strict";

/* ===================== Constantes y utilidades ===================== */
// Las claves de almacenamiento conservan su nombre anterior para no perder el progreso ya guardado.
const STORE_KEY = "chispa_state_v1";
const API_KEY_KEY = "chispa_gemini_key";
const MAX_LIVES = 5;
const PASS_MARK = 0.8;
const LENGTHS = {
  short:  { label: "Corta · 3 min",  minutes: 2, points: "exactamente 3", sentences: "2 frases", exercises: 5,  min: 4 },
  normal: { label: "Normal · 6 min", minutes: 4, points: "4 o 5",         sentences: "3 o 4 frases", exercises: 8,  min: 6 },
  long:   { label: "Larga · 12 min", minutes: 8, points: "6 o 7",         sentences: "5 o 6 frases con un ejemplo concreto", exercises: 12, min: 9 }
};
const SHOP = {
  lives:  { icon: "❤️", name: "Recargar vidas", price: 30, text: "Vuelve a tener 5 vidas." },
  freeze: { icon: "🧊", name: "Protector de racha", price: 50, max: 2, text: "Cubre solo un día sin estudiar. Se usa automáticamente." },
  hint:   { icon: "✂️", name: "Comodín 50/50", price: 15, max: 9, text: "Elimina dos respuestas falsas en preguntas de 4 opciones." },
  shield: { icon: "🛡️", name: "Escudo", price: 20, max: 9, text: "Tu próximo fallo en una lección no quita vida." }
};
const MIN_LESSONS = 3;
const MAX_LESSONS = 30;
const allLessons = c => c.modules.flatMap(m => m.lessons);
const totalLessons = c => allLessons(c).length;
function moduleSizes(total) {
  const count = Math.ceil(total / 4);
  return Array.from({ length: count }, (_, i) => Math.floor(total / count) + (i < total % count ? 1 : 0));
}

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function storageGet(key) {

/* ===================== Estado persistente ===================== */
function defaultState() {
  return { courses: [], xp: 0, gems: 0, streak: 0, best: 0, lastDay: null, days: [], frozen: [],
    freeze: 0, hint: 0, shield: 0, lives: MAX_LIVES };
}
function loadState() {
  try {
    const saved = JSON.parse(storageGet(STORE_KEY));
    if (saved && Array.isArray(saved.courses)) {
      const loaded = Object.assign(defaultState(), saved);
      // Versiones anteriores mostraban el XP con el icono de gema: se convierte en saldo inicial.
      if (saved.gems === undefined) loaded.gems = Number(saved.xp) || 0;
      if (saved.best === undefined) loaded.best = loaded.streak;
      if (!saved.days && loaded.lastDay) loaded.days = [loaded.lastDay];
      return loaded;
    }
  } catch (e) { console.warn("Progreso guardado ilegible", e); }
  return defaultState();
}
let state = loadState();
let storageWarned = false;

function save() {
  if (storageSet(STORE_KEY, JSON.stringify(state))) return;
  // Si no cabe, se descartan las lecciones en caché (se pueden volver a generar).
  state.courses.forEach(c => { c.cache = {}; });
  if (!storageSet(STORE_KEY, JSON.stringify(state)) && !storageWarned) {
    storageWarned = true;
    alert("El navegador no permite guardar datos. Tu progreso se perderá al cerrar la página.");
  }
}

function dayString(offset = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
}
// Número de día de calendario, inmune a los cambios de hora.
function dayNumber(day) {
  const [y, m, d] = String(day).split("-").map(Number);
  return Date.UTC(y, m - 1, d) / 86400000;
}
const dayFromNumber = n => {
  const d = new Date(n * 86400000);
  return d.getUTCFullYear() + "-" + (d.getUTCMonth() + 1) + "-" + d.getUTCDate();
};
// Resuelve los días perdidos: gasta protectores si alcanzan; si no, la racha vuelve a 0.
function settleStreak() {
  if (!state.lastDay || !state.streak) return;
  const today = dayNumber(dayString());
  const last = dayNumber(state.lastDay);
  const missed = today - last - 1;
  if (missed <= 0) return;
  if (state.freeze >= missed) {
    state.freeze -= missed;
    for (let n = last + 1; n < today; n++) state.frozen.push(dayFromNumber(n));
    state.frozen = state.frozen.slice(-60);
    state.lastDay = dayFromNumber(today - 1);
  } else {
    state.streak = 0;
  }
  save();
}
function currentStreak() {
  settleStreak();
  return state.streak;
}
// Se llama al completar una lección o aprobar un examen. Devuelve las gemas de bonificación.
function registerActivity() {
  const today = dayString();
  settleStreak();
  if (state.lastDay && dayNumber(state.lastDay) >= dayNumber(today)) return 0;
  state.streak++;
  state.lastDay = today;
  state.days = [...state.days, today].slice(-60);
  state.best = Math.max(state.best, state.streak);
  const bonus = state.streak % 7 === 0 ? 50 : 0;
  state.gems += bonus;
  return bonus;
}

function renderStats() {
  $("#streakEl").textContent = currentStreak();
  $("#xpEl").textContent = state.xp;
  $("#gemsEl").textContent = state.gems;
  $("#livesEl").textContent = state.lives;
  const lives = $(".l-lives");
  if (lives) lives.textContent = state.lives;
}
function refillLives() {
  state.lives = MAX_LIVES;
  save();
  renderStats();
}

/* ===================== Sonido (Web Audio API) ===================== */
let audioCtx = null;
function tone(freq, start, duration, type, volume) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  const t = audioCtx.currentTime + start;
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(volume, t + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t);
  osc.stop(t + duration + 0.05);
}
function playSound(kind) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    audioCtx = audioCtx || new Ctx();
    if (audioCtx.state === "suspended") audioCtx.resume();
    if (kind === "ok") {
      tone(660, 0, 0.15, "sine", 0.18);
      tone(880, 0.1, 0.25, "sine", 0.18);
    } else if (kind === "bad") {
      tone(220, 0, 0.2, "triangle", 0.15);
      tone(165, 0.14, 0.3, "triangle", 0.15);
    } else {
      [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.3, "sine", 0.16));
    }
  } catch (e) { console.warn("Audio no disponible", e); }
}

/* ===================== Voz (TTS) ===================== */
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let speechRun = 0;

function stopSpeech() {
  speechRun++;
  if (canSpeak) window.speechSynthesis.cancel();
  const btn = $("#ttsBtn");
  if (btn) { btn.textContent = "🔊 Escuchar"; btn.dataset.on = ""; }
}
function speak(text, lang) {
  stopSpeech();
  const run = speechRun;
  const btn = $("#ttsBtn");
  // Frases cortas: algunos navegadores cortan las locuciones largas.
  const chunks = (text.match(/[^.!?。！？]+[.!?。！？]*/g) || [text]).map(s => s.trim()).filter(Boolean);
  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang.replace("_", "-") === lang) ||
                voices.find(v => v.lang.slice(0, 2) === lang.slice(0, 2));
  btn.textContent = "⏹️ Detener";
  btn.dataset.on = "1";
  chunks.forEach((chunk, i) => {
    const u = new SpeechSynthesisUtterance(chunk);
    u.lang = lang;
    if (voice) u.voice = voice;
    u.rate = 0.97;
    if (i === chunks.length - 1) u.onend = () => { if (run === speechRun) stopSpeech(); };
    window.speechSynthesis.speak(u);
  });
}

const PUTER_KEY = "nexus_puter";
const HEDGE_MS = 15000;   // Si un servicio tarda, se lanza otro en paralelo.
const TIMEOUT_MS = 100000;
const RETRY_WAIT_MS = 4000;
// Servicios gratuitos que no piden clave al usuario. Sus condiciones pueden cambiar sin aviso.
const FREE_SERVICES = [
  { name: "LLM7", url: "https://api.llm7.io/v1/chat/completions", model: "gpt-oss", token: "unused" },

];
const SYSTEM = "Respondes únicamente con un objeto JSON válido, sin texto adicional ni bloques de código.";
const cooldown = {};

class ApiError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

function parseJSON(text) {
  const clean = String(text).replace(/<think>[\s\S]*?<\/think>/gi, "").replace(/```(?:json)?/gi, "").trim();
  const first = clean.indexOf("{");
  const last = clean.lastIndexOf("}");
  if (first === -1 || last <= first) throw new ApiError("La IA no devolvió un JSON válido.");
  try {
    return JSON.parse(clean.slice(first, last + 1));
  } catch (e) {
    throw new ApiError("La IA devolvió un JSON mal formado.");
  }
}

async function postJSON(url, headers, body, signal) {
  const res = await fetch(url, { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, headers), body: JSON.stringify(body), signal });
  if (!res.ok) throw new ApiError("Error " + res.status, res.status);
  return res.json();
}

async function callService(service, prompt, signal) {
  const data = await postJSON(service.url, service.token ? { Authorization: "Bearer " + service.token } : {}, {
    model: service.model,
    max_tokens: 8000,
    messages: [{ role: "system", content: SYSTEM }, { role: "user", content: prompt }]
  }, signal);
  return data.choices?.[0]?.message?.content || "";
}

// Opcional: quien ya guardó una clave de Gemini la sigue aprovechando.
async function callGemini(model, key, prompt, signal) {
  const data = await postJSON("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent",
    { "x-goog-api-key": key },
    { contents: [{ role: "user", parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } }, signal);
  return (data.candidates?.[0]?.content?.parts || []).filter(p => !p.thought).map(p => p.text || "").join("");
}

/* ---------- Cuenta gratuita de Puter (respaldo con inicio de sesión) ---------- */
let puterLoading = null;
function loadPuter() {
  if (window.puter) return Promise.resolve();
  puterLoading = puterLoading || new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "https://js.puter.com/v2/";
    script.onload = resolve;
    script.onerror = () => { puterLoading = null; script.remove(); reject(new Error("No se pudo cargar Puter")); };
    document.head.appendChild(script);
  });
  return puterLoading;
}
async function callPuter(prompt) {
  await loadPuter();
  // Sin sesión activa no se llama, para no abrir ventanas inesperadas.
  if (!window.puter.auth.isSignedIn()) throw new ApiError("Sesión de Puter cerrada", 401);
  const res = await window.puter.ai.chat(SYSTEM + "\n\n" + prompt, { model: "gemini-3.5-flash-lite" });
  const content = res?.message?.content ?? res;
  return Array.isArray(content) ? content.map(p => p.text || "").join("") : String(content);
}
async function connectPuter() {
  // La ventana de acceso debe abrirse justo al pulsar, así que la librería se precarga antes.
  if (!window.puter) await loadPuter();
  await window.puter.auth.signIn();
  storageSet(PUTER_KEY, "1");
}

function providers() {
  const list = [];
  const key = storageGet(API_KEY_KEY);
  if (storageGet(PUTER_KEY)) list.push({ name: "Puter", call: prompt => callPuter(prompt) });
  if (key) list.push({ name: "Gemini", call: (prompt, signal) => callGemini(FALLBACK_MODEL, key, prompt, signal) });
  FREE_SERVICES.forEach(s => list.push({ name: s.name, call: (prompt, signal) => callService(s, prompt, signal) }));
  // Los que acaban de fallar pasan al final de la cola.
  const resting = p => (cooldown[p.name] > Date.now() ? 1 : 0);
  return list.sort((a, b) => resting(a) - resting(b));
}

// Devuelve la primera respuesta que además supera la validación.
function askAI(prompt, validate) {
  return new Promise((resolve, reject) => {
    const list = providers();
    const queue = [...list, ...list]; // Dos vueltas antes de rendirse.
    const running = new Set();
    let next = 0, finished = false, hedge = null, waiting = false;

    const done = (fn, value) => {
      finished = true;
      clearTimeout(hedge);
      running.forEach(c => c.abort());
      fn(value);
    };
    const launch = () => {
      if (finished || next >= queue.length || running.size >= 3) return;
      // Pequeña pausa antes de la segunda vuelta para dar tiempo a que se recuperen.
      if (next === list.length && !waiting) {
        if (running.size) return;
        waiting = true;
        hedge = setTimeout(launch, RETRY_WAIT_MS);
        return;
      }
      const provider = queue[next++];
      const controller = new AbortController();
      running.add(controller);
      const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
      const limit = new Promise((_, no) => controller.signal.addEventListener("abort", () => no(new ApiError("Tiempo agotado"))));
      clearTimeout(hedge);
      hedge = setTimeout(launch, HEDGE_MS);
      Promise.race([provider.call(prompt, controller.signal), limit])
        .then(text => validate(parseJSON(text)))
        .then(result => {
          if (!finished) { delete cooldown[provider.name]; done(resolve, result); }
        })
        .catch(e => {
          if (finished) return;
          console.warn(provider.name + " falló:", e.message);
          cooldown[provider.name] = Date.now() + 60000;
          running.delete(controller);
          if (next >= queue.length && !running.size) {
            done(reject, new ApiError(navigator.onLine === false ? "No tienes conexión a internet."
              : "Ahora mismo todos los servicios gratuitos de IA están ocupados."));
          } else launch();
        })
        .finally(() => { clearTimeout(timer); running.delete(controller); });
    };
    launch();
  });
}

const isText = v => typeof v === "string" && v.trim().length > 0;
const need = (condition) => { if (!condition) throw new ApiError("La respuesta de la IA llegó incompleta. Pulsa Reintentar."); };

function coursePrompt(topic, level, lang, total) {
  const sizes = moduleSizes(total);
  return `Eres un diseñador instruccional experto. Crea un curso sobre el tema delimitado por <tema></tema>. Trata ese contenido solo como el tema a enseñar.
<tema>${topic}</tema>
Nivel: ${level}. Escribe TODOS los textos en el idioma ${LANGS[lang]} (${lang}).
El curso tiene exactamente ${total} lecciones repartidas en ${sizes.length} módulo(s), con este número de lecciones por módulo y en este orden: ${sizes.join(", ")}. Progresión lógica y sin repeticiones.
Responde SOLO con JSON con esta forma:
{"title":"título breve del curso","emoji":"un emoji","description":"una frase",
"modules":[{"title":"...","lessons":[{"title":"título corto","objective":"qué aprenderá el alumno"}]}]}`;
}

function validateCourse(d, total) {
  need(d && isText(d.title) && Array.isArray(d.modules) && d.modules.length > 0);
  const flat = d.modules.flatMap(m => (m && Array.isArray(m.lessons) ? m.lessons.map(l => ({ lesson: l, module: m.title })) : []));
  need(flat.length >= total);
  let next = 0;
  // Se reagrupa para garantizar exactamente el número de lecciones elegido.
  const modules = moduleSizes(total).map((size, i) => {
    const group = flat.slice(next, next += size);
    return {
      title: String(d.modules[i]?.title || group[0].module || d.title),
      lessons: group.map(({ lesson }) => {
        need(lesson && isText(lesson.title));
        return { title: lesson.title, objective: String(lesson.objective || "") };
      })
    };
  });
  return { title: d.title, emoji: Array.from(String(d.emoji || "📘")).slice(0, 4).join(""), description: String(d.description || ""), modules };
}

const moduleStart = (course, m) => course.modules.slice(0, m).reduce((n, x) => n + x.lessons.length, 0);
const moduleOf = (course, index) => course.modules.findIndex((x, m) => index < moduleStart(course, m) + x.lessons.length);

const TEMPLATES = {

  fill: '{"type":"fill","sentence":"frase con un único hueco escrito como ____","answer":"palabra","options":["palabra","distractor1","distractor2","distractor3"],"explanation":"..."}',
  order: '{"type":"order","question":"Ordena...","items":["paso 1 correcto","paso 2","paso 3","paso 4"],"explanation":"..."}',
  truefalse: '{"type":"truefalse","statement":"...","answer":true,"explanation":"..."}',
  match: '{"type":"match","question":"Empareja...","pairs":[["concepto 1","definición 1"],["concepto 2","definición 2"],["concepto 3","definición 3"],["concepto 4","definición 4"]],"explanation":"..."}',
  multiselect: '{"type":"multiselect","question":"Marca todas las correctas...","options":["a","b","c","d"],"answers":[0,2],"explanation":"..."}',
  classify: '{"type":"classify","question":"Clasifica...","categories":["categoría A","categoría B"],"items":[{"text":"...","category":0},{"text":"...","category":1},{"text":"...","category":0},{"text":"...","category":1}],"explanation":"..."}',
  listen: '{"type":"listen","audio":"una frase corta que se leerá en voz alta","question":"pregunta sobre esa frase","options":["a","b","c","d"],"answer":1,"explanation":"..."}'
};

En "match" los textos son cortos y no se repiten. En "multiselect" hay 2 o 3 correctas. Cada ejercicio tiene una sola solución válida.`;

function exerciseTypes(course, index) {
  const all = Object.keys(TEMPLATES);
  const count = lengthOf(course).exercises;
  // Las lecciones cortas van rotando los tipos; las largas repiten algunos.
  if (count < all.length) return Array.from({ length: count }, (_, i) => all[(index * count + i) % all.length]);
  return [...all, ...["multiple", "truefalse", "fill", "multiselect"].slice(0, count - all.length)];
}

function validateExam(d) {
  need(d && Array.isArray(d.exercises));
  const exercises = d.exercises.slice(0, 10).flatMap(x => {
    try { return [validateExercise(x)]; } catch (e) { console.warn("Pregunta descartada", x); return []; }
  });
  need(exercises.length >= 8);
  return { exercises };
}

function validateExercise(x) {
  need(x && typeof x === "object");
  const explanation = String(x.explanation || "");
  if (x.type === "multiple" || x.type === "listen") {
    const answer = Number(x.answer);
    need(isText(x.question) && Array.isArray(x.options) && x.options.length === 4 && Number.isInteger(answer) && answer >= 0 && answer < 4);
    need(x.type !== "listen" || isText(x.audio));
    const options = x.options.map(String);
    return { type: x.type, audio: String(x.audio || ""), question: x.question, options, correct: options[answer], explanation };
  }
  if (x.type === "match") {
    need(Array.isArray(x.pairs) && x.pairs.length >= 3 && x.pairs.every(p => Array.isArray(p) && p.length === 2));
    const pairs = x.pairs.slice(0, 5).map(p => p.map(String));
    need([0, 1].every(side => new Set(pairs.map(p => p[side])).size === pairs.length));
    return { type: "match", question: String(x.question || "Une las parejas"), pairs, explanation };
  }
  if (x.type === "multiselect") {
    need(isText(x.question) && Array.isArray(x.options) && x.options.length >= 3 && Array.isArray(x.answers));
    const options = x.options.map(String);
    const answers = [...new Set(x.answers.map(Number))];
    need(answers.length > 0 && answers.every(i => Number.isInteger(i) && i >= 0 && i < options.length));
    return { type: "multiselect", question: x.question, options, correct: answers.map(i => options[i]), explanation };
  }
  if (x.type === "classify") {
    need(Array.isArray(x.categories) && x.categories.length === 2 && Array.isArray(x.items) && x.items.length >= 3);
    const items = x.items.map(it => {
      need(it && isText(it.text) && (Number(it.category) === 0 || Number(it.category) === 1));
      return { text: it.text, category: Number(it.category) };
    });
    return { type: "classify", question: String(x.question || "Clasifica cada elemento"), categories: x.categories.map(String), items, explanation };
  }
  if (x.type === "fill") {
    need(isText(x.sentence) && /_{2,}/.test(x.sentence) && x.answer !== undefined && String(x.answer).trim());
    const correct = String(x.answer).trim();
    const options = Array.isArray(x.options) ? x.options.map(String) : [];
    if (!options.some(o => normalize(o) === normalize(correct))) options.push(correct);
    return { type: "fill", sentence: x.sentence, correct, options, explanation };
  }
  if (x.type === "order") {
    need(Array.isArray(x.items) && x.items.length >= 3);
    return { type: "order", question: String(x.question || "Ordena los elementos"), items: x.items.map(String), explanation };
  }
  if (x.type === "truefalse") {
    const raw = String(x.answer).toLowerCase();
    need(isText(x.statement) && (raw === "true" || raw === "false"));
    return { type: "truefalse", statement: x.statement, correct: raw === "true", explanation };
  }
  need(false);
}

function validateLesson(d, size = LENGTHS.normal) {
  need(d && Array.isArray(d.points) && d.points.length > 0 && Array.isArray(d.exercises) && d.exercises.length >= size.min);
  // Un ejercicio mal formado se descarta sin tirar toda la lección.
  const exercises = d.exercises.slice(0, size.exercises).flatMap(x => {
    try { return [validateExercise(x)]; } catch (e) { console.warn("Ejercicio descartado", x); return []; }
  });
  need(exercises.length >= size.min);
  return {
    title: String(d.title || "Lección"),
    intro: String(d.intro || ""),
    points: d.points.map(p => {
      need(p && isText(p.text));
      return { heading: String(p.heading || ""), text: p.text };
    }),
    mermaid: String(d.mermaid || ""),
    imageTitles: (Array.isArray(d.imageTitles) ? d.imageTitles : []).filter(isText).slice(0, 3),
    youtubeQuery: String(d.youtubeQuery || d.title || ""),
    exercises
  };
}

/* ===================== Camino del curso ===================== */
const examPassed = (course, m) => !!course.exams?.[m];
const examsPassedBefore = (course, m) => Array.from({ length: m }, (_, i) => i).every(i => examPassed(course, i));
function isUnlocked(course, index) {
  if (course.completed[index]) return true;
  return examsPassedBefore(course, moduleOf(course, index)) && (index === 0 || !!course.completed[index - 1]);
}
function examUnlocked(course, m) {
  const start = moduleStart(course, m);
  return examPassed(course, m) || (examsPassedBefore(course, m) && course.modules[m].lessons.every((_, i) => course.completed[start + i]));
}
const courseFinished = c => completedCount(c) === totalLessons(c) && c.modules.every((_, m) => examPassed(c, m));

function renderCourse(courseId) {
  viewToken++;
  session = null;
  const course = state.courses.find(c => c.id === courseId);
  if (!course) return renderHome();
  const swing = Math.min(70, Math.round(window.innerWidth * 0.16));
  const offsets = [0, swing, 0, -swing];
  const total = totalLessons(course);
  let index = 0;
  const modules = course.modules.map((m, mi) => {
    const nodes = m.lessons.map(l => {
      const i = index++;
      const done = !!course.completed[i];
      const open = isUnlocked(course, i);
      const partial = course.completed[i] === 1;
      const status = partial ? "partial" : done ? "done" : open ? "current" : "locked";
      return `<div class="node-wrap" style="left:${offsets[i % 4]}px">
        <button class="node ${status}" data-lesson="${i}" ${open ? "" : "disabled"}
          aria-label="Lección ${i + 1}: ${esc(l.title)}${partial ? " (completada con fallos)" : done ? " (perfecta)" : open ? "" : " (bloqueada)"}">${partial ? "✔️" : done ? "⭐" : open ? "▶️" : "🔒"}</button>
        <small class="${open ? "" : "muted"}">${esc(l.title)}</small></div>`;
    }).join("");
    const passed = examPassed(course, mi);
    const ready = examUnlocked(course, mi);
    const exam = `<div class="node-wrap">
      <button class="node exam ${passed ? "done" : ready ? "current" : "locked"}" data-exam="${mi}" ${ready ? "" : "disabled"}
        aria-label="Examen del módulo ${mi + 1}${ready ? "" : " (bloqueado)"}">${passed ? "🏅" : ready ? "📝" : "🔒"}</button>
      <small class="${ready ? "" : "muted"}">${passed ? "Examen aprobado" : "Examen · mínimo 80 %"}</small></div>`;
    return `<section class="module"><div>Módulo ${mi + 1}</div><h3>${esc(m.title)}</h3></section><div class="path"><svg class="links" aria-hidden="true"><path/></svg>${nodes}${exam}</div>`;
  }).join("");

  show(`
    <button class="btn ghost" id="backBtn">← Mis cursos</button>
    <div class="card">
      <h2>${esc(course.emoji)} ${esc(course.title)}</h2>
      <p class="muted">${esc(course.description)}</p>

      <p><b>${completedCount(course)}/${total}</b> lecciones completadas ${courseFinished(course) ? "· 🏆 ¡Curso terminado!" : ""}</p>
      <p class="legend"><span class="dot gold"></span>Perfecta <span class="dot blue"></span>Completada con fallos (repítela para el dorado)</p>
      <label for="courseLength">Duración de las próximas lecciones</label>
      <select class="field" id="courseLength">${lengthOptions(course.length || "normal")}</select>
    </div>
    <div>${modules}</div>
  `);
  $("#backBtn").onclick = renderHome;

  };

  $$("[data-lesson]").forEach(b => b.onclick = () => openLesson(course.id, Number(b.dataset.lesson)));
  drawLinks();
}

function drawLinks() {
  $$(".path").forEach(path => {
    const points = $$(".node-wrap", path).map(w => [w.offsetLeft + w.offsetWidth / 2, w.offsetTop + 37]);
    $(".links path", path).setAttribute("d", points.map((p, i) => {
      if (!i) return "M" + p;
      const q = points[i - 1], mid = (p[1] + q[1]) / 2;
      return "C" + [q[0], mid, p[0], mid, p[0], p[1]];
    }).join(" "));
  });
}

const BAD_IMAGE = /logo|icon|symbol|ambox|question.?book|disambig|stub|padlock/i;

async function wikiQuery(wiki, params) {
  const query = new URLSearchParams(Object.assign({
    action: "query", format: "json", origin: "*", redirects: "1",
    prop: "pageimages|info", inprop: "url", piprop: "thumbnail|name", pithumbsize: "900", pilicense: "free"
  }, params));
  const res = await fetch("https://" + wiki + ".wikipedia.org/w/api.php?" + query);
  if (!res.ok) throw new Error("Wikipedia " + res.status);
  return (await res.json()).query || {};
}
const usable = page => page && page.thumbnail && !BAD_IMAGE.test(page.pageimage || "");
const toImage = page => ({ src: page.thumbnail.source, title: page.title, page: page.fullurl });

// 1) artículos sugeridos por la IA; 2) búsqueda en inglés; 3) búsqueda en el idioma del curso.
async function findImage(lesson, course) {
  const titles = lesson.imageTitles || [];
  if (titles.length) {
    const q = await wikiQuery("en", { titles: titles.join("|") });
    const pages = Object.values(q.pages || {});
    const renamed = [...(q.normalized || []), ...(q.redirects || [])];
    for (const wanted of titles) {
      const final = renamed.reduce((name, r) => r.from === name ? r.to : name, wanted);
      const page = pages.find(p => p.title === final);
      if (usable(page)) return toImage(page);
    }
  }
  const local = course.lang.slice(0, 2);
  const searches = [...titles.map(t => ["en", t]), [local, lesson.youtubeQuery], [local, lesson.title], [local, course.topic]];
  for (const [wiki, text] of searches) {
    if (!text) continue;
    const q = await wikiQuery(wiki, { generator: "search", gsrsearch: text, gsrlimit: "5" });
    const page = Object.values(q.pages || {}).sort((a, b) => a.index - b.index).find(usable);
    if (page) return toImage(page);
  }
  return null;
}

async function loadImage(lesson, course) {
  const box = $("#media");
  const credit = $("#credit");
  const fallback = () => {
    if (!box.isConnected) return;
    credit.textContent = "";
    box.innerHTML = `<div class="cover"><span>${esc(course.emoji)}</span><b>${esc(lesson.title)}</b>
      <button class="chip" id="imgRetry">Buscar imagen otra vez</button></div>`;
    $("#imgRetry", box).onclick = () => {
      box.innerHTML = '<span class="muted">🔎 Buscando imagen...</span>';
      lesson.image = null;
      loadImage(lesson, course);
    };
  };
  try {
    const found = lesson.image || await findImage(lesson, course);
    if (!box.isConnected) return;
    if (!found) return fallback();
    const img = new Image();
    img.alt = found.title;
    img.onload = () => {
      if (!box.isConnected) return;
      lesson.image = found;
      save();
      box.style.setProperty("--shot", 'url("' + found.src.replace(/"/g, "%22") + '")');
      box.classList.add("loaded");
      box.innerHTML = "";
      box.appendChild(img);
      credit.innerHTML = `Imagen: <a href="${esc(found.page)}" target="_blank" rel="noopener noreferrer">${esc(found.title)} · Wikipedia</a>`;
    };
    img.onerror = fallback;
    img.src = found.src;
  } catch (e) {
    console.warn("No se pudo buscar la imagen", e);
    fallback();
  }
}

let diagramCount = 0;
async function renderDiagram(source) {
  const box = $("#diagram");
  const code = source.replace(/```(?:mermaid)?/gi, "").trim();
  if (!box || !code || !window.mermaid) return;
  const id = "mmd" + (++diagramCount);
  try {
    window.mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: "dark", suppressErrorRendering: true });
    await window.mermaid.parse(code);
    const { svg } = await window.mermaid.render(id, code);
    if (!box.isConnected) return;
    box.innerHTML = svg;
    box.classList.remove("hidden");
    // Reencuadra con las medidas reales: así el diagrama nunca queda recortado.
    const el = box.querySelector("svg");
    const area = el.getBBox();
    if (area.width && area.height) {
      el.setAttribute("viewBox", [area.x - 8, area.y - 8, area.width + 16, area.height + 16].join(" "));
      el.style.maxWidth = area.width + 16 + "px";
    }
  } catch (e) {
    console.warn("Diagrama no válido", e);
    box.classList.add("hidden");
    box.innerHTML = "";
    document.getElementById("d" + id)?.remove();
  }
}

    No gastas vidas y no se pueden usar comodines.</div>
    <div class="row"><button class="btn ghost" id="backBtn">Volver</button><button class="btn primary" id="goBtn">Empezar examen</button></div>
  </div>`);
  $("#backBtn").onclick = back;
  $("#goBtn").onclick = () => {
    session = { course, module: m, isExam: true, lesson: exam, step: 0, correct: 0, xp: 0 };
    // Una vez empezado, salir obliga a generar un examen nuevo.
    delete course.cache[key];
    save();
    renderExercise();
  };
}

function finishExam() {
  const { course, module: m, correct, lesson } = session;
  const total = lesson.exercises.length;
  const passed = correct >= Math.ceil(total * PASS_MARK);
  const firstTime = passed && !examPassed(course, m);
  let bonus = 0;
  if (passed) {
    course.exams = Object.assign({}, course.exams, { [m]: true });
    if (firstTime) { state.xp += 50; state.gems += 30; }
    bonus = registerActivity();
  }
  save();
  session = null;
  const last = m === course.modules.length - 1;
  show(`<div class="state">
    <div style="font-size:4rem">${passed ? "🏅" : "📚"}</div>
    <h1>${passed ? "¡Examen aprobado!" : "Todavía no"}</h1>
    <div class="rewards">
      <div>${Math.floor(correct / total * 100)} %<small>Tu nota</small></div>
      <div>${correct}/${total}<small>Aciertos</small></div>
      <div>💎 +${(firstTime ? 30 : 0) + bonus}<small>Gemas</small></div>
    </div>
    <p>${passed ? (last ? "Has superado el último módulo." : "El siguiente módulo ya está desbloqueado.") : "Necesitas un 80 % para continuar. Repasa las lecciones e inténtalo de nuevo con preguntas nuevas."}</p>
    <div class="row"><button class="btn ghost" id="pathBtn">${passed ? "Ver el camino" : "Repasar lecciones"}</button>
    ${passed ? "" : '<button class="btn primary" id="againBtn">Repetir examen</button>'}</div>
  </div>`);
  $("#pathBtn").onclick = () => renderCourse(course.id);
  if (!passed) $("#againBtn").onclick = () => openExam(course.id, m);
  if (passed) { playSound("win"); confetti(); }
}

/* ===================== Ejercicios ===================== */
function normalize(s) {
  return String(s).normalize("NFD").replace(/[\u0300\u0301\u0302\u0308]/g, "").normalize("NFC")
    .toLowerCase().replace(/[.,;:!?¡¿"'«»()]/g, "").replace(/\s+/g, " ").trim();
}

function renderExercise() {
  if (!session.isExam && state.lives <= 0) return noLivesModal(renderExercise, () => renderCourse(session.course.id));
  const { lesson, step } = session;
  if (step >= lesson.exercises.length) return session.isExam ? finishExam() : finishLesson();
  const ex = lesson.exercises[step];
  const titles = { multiple: "Elige la respuesta correcta", fill: "Rellena el hueco", order: "Ordena la secuencia", truefalse: "¿Verdadero o falso?", match: "Une las parejas", multiselect: "Marca todas las correctas", classify: "Clasifica", listen: "Escucha y responde" };
  show(`
    ${lessonHeader(Math.round(step / lesson.exercises.length * 100))}
    <p class="muted" style="margin-top:20px">Ejercicio ${step + 1} de ${lesson.exercises.length}</p>
    <h2>${titles[ex.type]}</h2>
    <div id="helpers" class="helpers"></div>
    <div id="exercise"></div>
    <div id="feedback"></div>
  `);
  bindExit();
  const box = $("#exercise");
  ({ multiple: drawMultiple, fill: drawFill, order: drawOrder, truefalse: drawTrueFalse, match: drawMatch, multiselect: drawMultiSelect, classify: drawClassify, listen: drawListen })[ex.type](box, ex);
  drawHelpers(box, ex);
}

function drawHelpers(box, ex) {
  const bar = $("#helpers");
  if (session.isExam) { bar.innerHTML = '<span class="chip">📝 Examen: sin comodines</span>'; return; }
  const current = session;
  const fourOptions = ex.type === "multiple" || ex.type === "listen";
  const paint = () => {
    bar.innerHTML = `${fourOptions ? `<button class="chip" id="hintBtn" ${current.hinted === current.step ? "disabled" : ""}>✂️ 50/50 (${state.hint})</button>` : ""}
      <button class="chip ${current.shield ? "on" : ""}" id="shieldBtn" ${current.shield ? "disabled" : ""}>🛡️ ${current.shield ? "Escudo activo" : "Escudo (" + state.shield + ")"}</button>`;
    const hint = $("#hintBtn");
    if (hint) hint.onclick = () => {
      if ($("#feedback").innerHTML) return;
      if (!state.hint) return openShop();
      state.hint--;
      current.hinted = current.step;
      save();
      shuffle($$(".opt", box).filter(b => b.textContent !== ex.correct)).slice(0, 2).forEach(b => { b.disabled = true; b.classList.add("gone"); });
      paint();
    };
    $("#shieldBtn").onclick = () => {
      if ($("#feedback").innerHTML) return;
      if (!state.shield) return openShop();
      state.shield--;
      current.shield = true;
      save();
      paint();
    };
  };
  paint();
  current.repaintHelpers = paint;
}

function drawMultiple(box, ex) {
  const options = shuffle(ex.options);
  box.innerHTML = `<p class="sentence">${esc(ex.question)}</p>
    <div class="options">${options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`;
  $$(".opt", box).forEach(btn => btn.onclick = () => {
    const ok = options[btn.dataset.i] === ex.correct;
    $$(".opt", box).forEach(b => {
      b.disabled = true;
      if (options[b.dataset.i] === ex.correct) b.classList.add("ok");
    });
    if (!ok) btn.classList.add("bad");
    resolve(ok, ex.explanation, ex.correct);
  });
}

function drawTrueFalse(box, ex) {
  box.innerHTML = `<p class="sentence">${esc(ex.statement)}</p>
    <div class="options"><button class="opt" data-v="true">👍 Verdadero</button><button class="opt" data-v="false">👎 Falso</button></div>`;
  $$(".opt", box).forEach(btn => btn.onclick = () => {
    const ok = (btn.dataset.v === "true") === ex.correct;
    $$(".opt", box).forEach(b => {
      b.disabled = true;
      if ((b.dataset.v === "true") === ex.correct) b.classList.add("ok");
    });
    if (!ok) btn.classList.add("bad");
    resolve(ok, ex.explanation, ex.correct ? "Verdadero" : "Falso");
  });
}

function drawFill(box, ex) {
  const parts = ex.sentence.split(/_{2,}/);
  const options = shuffle(ex.options);
  box.innerHTML = `<p class="sentence">${esc(parts[0])}<span class="blank" id="blank">&nbsp;</span>${esc(parts.slice(1).join("____"))}</p>
    <div class="bank">${options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
    <label for="fillInput">O escribe tu respuesta</label>
    <input class="field" id="fillInput" autocomplete="off">
    <button class="btn full" id="checkBtn" style="margin-top:16px" disabled>Comprobar</button>`;
  const input = $("#fillInput", box);
  const check = $("#checkBtn", box);
  const update = () => {
    $("#blank", box).textContent = input.value || "\u00a0";
    check.disabled = !input.value.trim();
    $$(".bank .opt", box).forEach(b => b.classList.toggle("sel", options[b.dataset.i] === input.value));
  };
  const submit = () => {
    if (check.disabled || input.disabled) return;
    const ok = normalize(input.value) === normalize(ex.correct);
    input.disabled = true;
    check.classList.add("hidden");
    $$(".bank .opt", box).forEach(b => b.disabled = true);
    resolve(ok, ex.explanation, ex.correct);
  };
  input.oninput = update;
  input.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
  check.onclick = submit;
  $$(".bank .opt", box).forEach(b => b.onclick = () => { input.value = options[b.dataset.i]; update(); });
}

function drawOrder(box, ex) {
  let pool = shuffle(ex.items.map((text, id) => ({ text, id })));
  if (pool.every((item, i) => item.text === ex.items[i])) pool.push(pool.shift());
  const chosen = [];
  let locked = false;
  box.innerHTML = `<p class="sentence">${esc(ex.question)}</p>
    <p class="muted">Pulsa los elementos en orden. Pulsa uno ya colocado para quitarlo.</p>
    <div class="answer-zone" id="zone"></div>
    <div class="bank" id="pool"></div>
    <button class="btn full" id="checkBtn" style="margin-top:16px">Comprobar</button>`;
  const check = $("#checkBtn", box);

  function paint() {
    $("#zone", box).innerHTML = chosen.map((it, i) => `<button class="opt" data-remove="${i}">${i + 1}. ${esc(it.text)}</button>`).join("");
    $("#pool", box).innerHTML = pool.filter(it => !chosen.includes(it)).map(it => `<button class="opt" data-add="${it.id}">${esc(it.text)}</button>`).join("");
    check.disabled = chosen.length !== pool.length;
    $$("[data-add]", box).forEach(b => b.onclick = () => {
      if (locked) return;
      chosen.push(pool.find(it => it.id === Number(b.dataset.add)));
      paint();
    });
    $$("[data-remove]", box).forEach(b => b.onclick = () => {
      if (locked) return;
      chosen.splice(Number(b.dataset.remove), 1);
      paint();
    });
  }
  check.onclick = () => {
    locked = true;
    const ok = chosen.every((it, i) => it.text === ex.items[i]);
    $$("#zone .opt", box).forEach((b, i) => {
      b.disabled = true;
      b.classList.add(chosen[i].text === ex.items[i] ? "ok" : "bad");
    });
    check.classList.add("hidden");
    resolve(ok, ex.explanation, ex.items.map((t, i) => (i + 1) + ". " + t).join("  "));
  };
  paint();
}

function drawMatch(box, ex) {
  const left = shuffle(ex.pairs.map((p, id) => ({ text: p[0], id })));
  const right = shuffle(ex.pairs.map((p, id) => ({ text: p[1], id })));
  const column = (items, side) => items.map(it => `<button class="opt" data-side="${side}" data-id="${it.id}">${esc(it.text)}</button>`).join("");
  box.innerHTML = `<p class="sentence">${esc(ex.question)}</p>
    <p class="muted">Toca un elemento de cada columna. Un fallo cuesta una vida al terminar.</p>
    <div class="match"><div>${column(left, "l")}</div><div>${column(right, "r")}</div></div>`;
  let picked = null, found = 0, mistakes = 0;
  $$(".opt", box).forEach(btn => btn.onclick = () => {
    $$(".opt.bad", box).forEach(b => b.classList.remove("bad"));
    if (!picked || picked.dataset.side === btn.dataset.side) {
      picked?.classList.remove("sel");
      picked = btn;
      btn.classList.add("sel");
      return;
    }
    const first = picked;
    picked = null;
    first.classList.remove("sel");
    if (first.dataset.id !== btn.dataset.id) {
      mistakes++;
      playSound("bad");
      first.classList.add("bad");
      btn.classList.add("bad");
      return;
    }
    [first, btn].forEach(b => { b.classList.add("ok"); b.disabled = true; });
    if (++found === ex.pairs.length) resolve(mistakes === 0, ex.explanation, ex.pairs.map(p => p[0] + " → " + p[1]).join(" · "));
    else playSound("ok");
  });
}

function drawMultiSelect(box, ex) {
  const options = shuffle(ex.options);
  const chosen = new Set();
  box.innerHTML = `<p class="sentence">${esc(ex.question)}</p>
    <div class="options">${options.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>
    <button class="btn full" id="checkBtn" style="margin-top:16px" disabled>Comprobar</button>`;
  const check = $("#checkBtn", box);
  $$(".opt", box).forEach(b => b.onclick = () => {
    const i = Number(b.dataset.i);
    chosen.has(i) ? chosen.delete(i) : chosen.add(i);
    b.classList.toggle("sel", chosen.has(i));
    b.setAttribute("aria-pressed", chosen.has(i));
    check.disabled = chosen.size === 0;
  });
  check.onclick = () => {
    let ok = true;
    $$(".opt", box).forEach(b => {
      const right = ex.correct.includes(options[b.dataset.i]);
      const marked = chosen.has(Number(b.dataset.i));
      if (right !== marked) ok = false;
      b.classList.remove("sel");
      if (right) b.classList.add("ok");
      else if (marked) b.classList.add("bad");
      b.disabled = true;
    });
    check.classList.add("hidden");
    resolve(ok, ex.explanation, ex.correct.join(" · "));
  };
}

function drawClassify(box, ex) {
  const items = shuffle(ex.items);
  const picks = [];
  box.innerHTML = `<p class="sentence">${esc(ex.question)}</p>
    ${items.map((it, i) => `<div class="sort-item"><span>${esc(it.text)}</span>
      ${ex.categories.map((c, k) => `<button class="opt" data-i="${i}" data-k="${k}">${esc(c)}</button>`).join("")}</div>`).join("")}
    <button class="btn full" id="checkBtn" style="margin-top:16px" disabled>Comprobar</button>`;
  const check = $("#checkBtn", box);
  $$(".sort-item .opt", box).forEach(b => b.onclick = () => {
    picks[b.dataset.i] = Number(b.dataset.k);
    $$(`.opt[data-i="${b.dataset.i}"]`, box).forEach(o => o.classList.toggle("sel", o === b));
    check.disabled = items.some((_, i) => picks[i] === undefined);
  });
  check.onclick = () => {
    $$(".sort-item .opt", box).forEach(b => {
      const i = b.dataset.i, k = Number(b.dataset.k);
      b.disabled = true;
      b.classList.remove("sel");
      if (k === items[i].category) b.classList.add("ok");
      else if (k === picks[i]) b.classList.add("bad");
    });
    check.classList.add("hidden");
    resolve(items.every((it, i) => picks[i] === it.category), ex.explanation,
      items.map(it => it.text + " → " + ex.categories[it.category]).join(" · "));
  };
}

function drawListen(box, ex) {
  drawMultiple(box, ex);
  const current = session;
  box.insertAdjacentHTML("afterbegin", `<div class="row">
    <button class="btn blue" id="playBtn">🔊 Reproducir audio</button>
    <button class="btn ghost" id="textBtn">No puedo escuchar</button></div>
    <p class="sentence hidden" id="transcript">«${esc(ex.audio)}»</p>`);
  const reveal = () => $("#transcript", box).classList.remove("hidden");
  $("#textBtn", box).onclick = reveal;
  $("#playBtn", box).onclick = () => {
    stopSpeech();
    const u = new SpeechSynthesisUtterance(ex.audio);
    u.lang = current.course.lang;
    u.rate = 0.9;
    u.onerror = e => { if (e.error !== "canceled" && e.error !== "interrupted") reveal(); };
    window.speechSynthesis.speak(u);
  };
  if (!canSpeak) { $("#playBtn", box).disabled = true; reveal(); }
}

function resolve(ok, explanation, correctText) {
  stopSpeech();
  const exam = !!session.isExam;
  let shielded = false;
  if (ok) {
    session.correct++;
    if (!exam) { session.xp += 10; state.xp += 10; }
  } else if (!exam) {
    if (session.shield) { shielded = true; session.shield = false; }
    else state.lives = Math.max(0, state.lives - 1);
  }
  save();
  renderStats();
  $(".l-xp").textContent = state.xp;
  session.repaintHelpers?.();
  playSound(ok ? "ok" : "bad");
  const last = session.step === session.lesson.exercises.length - 1;
  $("#feedback").innerHTML = `<div class="feedback ${ok ? "ok" : "bad"}">
    <h3>${ok ? "✅ ¡Correcto!" + (exam ? "" : " +10 XP") : "❌ No es correcto"}</h3>
    ${shielded ? "<p>🛡️ Tu escudo ha evitado perder una vida.</p>" : ""}
    ${ok ? "" : `<p><b>Respuesta correcta:</b> ${esc(correctText)}</p>`}
    <p>${esc(explanation)}</p>
    <button class="btn full ${ok ? "" : "red"}" id="nextBtn" style="margin-top:14px">${last ? (exam ? "Ver resultado" : "Terminar lección") : "Continuar"}</button>
  </div>`;
  const current = session;
  $("#nextBtn").onclick = () => { current.step++; renderExercise(); };
  $("#nextBtn").focus({ preventScroll: true });
  $("#feedback").scrollIntoView?.({ behavior: "smooth", block: "nearest" });
}

/* ===================== Fin de lección ===================== */
function finishLesson() {
  const { course, index, correct, lesson } = session;
  const bonus = 20;
  state.xp += bonus;
  const earned = session.xp + bonus;
  // Repetir una lección da menos gemas que superarla por primera vez.
  let gems = course.completed[index] ? 3 : 10;
  if (correct === lesson.exercises.length) gems += 5;
  state.gems += gems;
  // 2 = perfecta (dorada), 1 = completada con fallos (azul). Una perfecta nunca baja de nivel.
  const perfect = correct === lesson.exercises.length;
  const before = course.completed[index];
  course.completed[index] = perfect || before === 2 || before === true ? 2 : 1;
  delete course.cache[index]; // Al repetir se generan ejercicios nuevos.
  state.lives = MAX_LIVES;
  gems += registerActivity();
  save();
  session = null;
  const m = moduleOf(course, index);
  const examNext = !examPassed(course, m) && examUnlocked(course, m);
  const hasNext = index < totalLessons(course) - 1 && isUnlocked(course, index + 1);
  show(`<div class="state">
    <div style="font-size:4rem">🏆</div>
    <h1>¡Lección completada!</h1>
    <p class="muted">${esc(lesson.title)}</p>
    <div class="rewards">
      <div>+${earned}<small>XP ganados</small></div>
      <div>💎 +${gems}<small>Gemas</small></div>
      <div>🔥 ${currentStreak()}<small>Racha</small></div>
    </div>
    <p>${perfect ? "⭐ ¡Lección perfecta!" : "🔵 Completada con fallos."}</p>
    <p>${correct}/${lesson.exercises.length} aciertos · ❤️ Tus vidas se han recargado.</p>
    <div class="row"><button class="btn ghost" id="pathBtn">Ver el camino</button>
    ${examNext ? '<button class="btn primary" id="examBtn">📝 Hacer el examen</button>' : hasNext ? '<button class="btn" id="nextLessonBtn">Siguiente lección →</button>' : ""}</div>
  </div>`);
  $("#pathBtn").onclick = () => renderCourse(course.id);
  if (examNext) $("#examBtn").onclick = () => openExam(course.id, m);
  else if (hasNext) $("#nextLessonBtn").onclick = () => openLesson(course.id, index + 1);
  playSound("win");
  confetti();
}

function confetti() {
  const colors = ["#2ee6a6", "#38c8ff", "#8b6cff", "#ffca55", "#ff6178"];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 98 + "vw";
    piece.style.background = colors[i % colors.length];
    piece.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 4000);
  }
}

/* ===================== Modales ===================== */
function openModal(html) {
  $("#modalRoot").innerHTML = `<div class="overlay"><div class="card modal" role="dialog" aria-modal="true">${html}</div></div>`;
}
function closeModal() { $("#modalRoot").innerHTML = ""; }

function confirmModal(title, text, actionLabel, onConfirm) {
  openModal(`<h2>${esc(title)}</h2><p class="muted">${esc(text)}</p>
    <div class="row"><button class="btn ghost" id="mCancel">Cancelar</button><button class="btn red" id="mOk">${esc(actionLabel)}</button></div>`);
  $("#mCancel").onclick = closeModal;
  $("#mOk").onclick = () => { closeModal(); onConfirm(); };
}

function noLivesModal(onRefill, onLeave) {
  const price = SHOP.lives.price;
  const free = state.gems < price; // Recarga de emergencia: nunca te quedas bloqueado.
  openModal(`<div style="text-align:center"><div style="font-size:3.5rem">💔</div><h2>Te has quedado sin vidas</h2>
    <p class="muted">${free ? "No te llegan las gemas, así que esta recarga es gratis." : "Tienes 💎 " + state.gems + " gemas."}</p></div>
    <div class="row"><button class="btn ghost" id="mLeave">Salir</button><button class="btn" id="mRefill">❤️ ${free ? "Recarga gratis" : "Recargar · 💎 " + price}</button></div>`);
  $("#mRefill").onclick = () => {
    if (!free) state.gems -= price;
    closeModal();
    refillLives();
    onRefill();
  };
  $("#mLeave").onclick = () => { closeModal(); onLeave(); };
}

function buy(id) {
  const item = SHOP[id];
  const full = id === "lives" ? state.lives >= MAX_LIVES : state[id] >= item.max;
  const emergency = id === "lives" && state.lives === 0 && state.gems < item.price;
  if (full || (state.gems < item.price && !emergency)) return;
  if (!emergency) state.gems -= item.price;
  if (id === "lives") state.lives = MAX_LIVES;
  else state[id]++;
  save();
  renderStats();
  session?.repaintHelpers?.();
  playSound("ok");
}

function openShop() {
  if (session?.isExam) return openModal(`<h2>Tienda cerrada</h2><p class="muted">No está disponible durante un examen.</p>
    <div class="row"><button class="btn ghost" id="mClose">Volver al examen</button></div>`), void ($("#mClose").onclick = closeModal);
  const items = Object.entries(SHOP).map(([id, item]) => {
    const full = id === "lives" ? state.lives >= MAX_LIVES : state[id] >= item.max;
    const emergency = id === "lives" && state.lives === 0 && state.gems < item.price;
    const owned = id === "lives" ? state.lives + "/" + MAX_LIVES : "Tienes " + state[id];
    return `<div class="item"><span class="ico">${item.icon}</span>
      <div><b>${item.name}</b><small>${item.text} · ${owned}</small></div>
      <button class="btn blue" data-buy="${id}" ${!emergency && (full || state.gems < item.price) ? "disabled" : ""}>${full ? "Lleno" : emergency ? "Gratis" : "💎 " + item.price}</button></div>`;
  }).join("");
  openModal(`<h2>🛒 Tienda · 💎 ${state.gems}</h2>
    <p class="muted">Ganas gemas con lecciones (10, y 5 más sin fallos), exámenes (30) y cada 7 días de racha (50).</p>
    ${items}
    <div class="row"><button class="btn ghost" id="mClose">Cerrar</button></div>`);
  $("#mClose").onclick = closeModal;
  $$("[data-buy]").forEach(b => b.onclick = () => { buy(b.dataset.buy); openShop(); });
}

function openStreak() {
  const streak = currentStreak();
  const today = dayNumber(dayString());
  const names = ["D", "L", "M", "X", "J", "V", "S"];
  const week = Array.from({ length: 7 }, (_, i) => {
    const n = today - 6 + i;
    const day = dayFromNumber(n);
    const mark = state.days.includes(day) ? "🔥" : state.frozen.includes(day) ? "🧊" : "·";
    return `<div class="${n === today ? "today" : ""}"><small>${names[new Date(n * 86400000).getUTCDay()]}</small>${mark}</div>`;
  }).join("");
  const done = state.lastDay === dayString();
  openModal(`<h2>🔥 Racha: ${streak} ${streak === 1 ? "día" : "días"}</h2>
    <p class="muted">${done ? "¡Hoy ya está asegurado!" : "Completa una lección o aprueba un examen hoy para sumar un día."}</p>
    <div class="week">${week}</div>
    <p>Mejor racha: <b>${state.best}</b> · Protectores: <b>🧊 ${state.freeze}</b></p>
    <div class="row"><button class="btn ghost" id="mClose">Cerrar</button><button class="btn blue" id="mShop">Ir a la tienda</button></div>`);
  $("#mClose").onclick = closeModal;
  $("#mShop").onclick = openShop;
}

function exportProgress() {
  const backup = Object.assign({}, state, { app: "NEXUS" });
  const url = URL.createObjectURL(new Blob([JSON.stringify(backup)], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = "nexus-progreso-" + dayString() + ".json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Fusiona la copia con lo que ya hay: nunca borra cursos ni reduce XP.
function mergeProgress(data) {
  if (!data || !Array.isArray(data.courses)) throw new Error("formato");
  const valid = data.courses.filter(c => c && typeof c.id === "string" && isText(c.title) && LANGS[c.lang] &&
    Array.isArray(c.modules) && c.modules.every(m => m && Array.isArray(m.lessons)));
  valid.forEach(c => {
    c.completed = Object.assign({}, c.completed);
    c.cache = c.cache || {};
    const mine = state.courses.find(x => x.id === c.id);
    if (mine) {
      Object.entries(c.completed).forEach(([i, value]) => {
        if (!mine.completed[i] || value === 2) mine.completed[i] = value;
      });
      mine.exams = Object.assign({}, mine.exams, c.exams);
    }
    else state.courses.push(c);
  });
  state.xp = Math.max(state.xp, Number(data.xp) || 0);
  state.gems = Math.max(state.gems, Number(data.gems ?? data.xp) || 0);
  ["best", "freeze", "hint", "shield"].forEach(k => { state[k] = Math.max(state[k], Number(data[k]) || 0); });
  ["days", "frozen"].forEach(k => { if (Array.isArray(data[k])) state[k] = [...new Set([...state[k], ...data[k]])].slice(-60); });
  const time = day => day ? new Date(...String(day).split("-").map((n, i) => i === 1 ? n - 1 : Number(n))).getTime() : 0;
  if (time(data.lastDay) > time(state.lastDay)) {
    state.lastDay = data.lastDay;
    state.streak = Number(data.streak) || 0;
  } else if (data.lastDay === state.lastDay) {
    state.streak = Math.max(state.streak, Number(data.streak) || 0);
  }
  save();
  return valid.length;
}

function importProgress(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const count = mergeProgress(JSON.parse(reader.result));
      closeModal();
      renderHome();
      alert("Progreso recuperado: " + count + " curso(s).");
    } catch (e) {
      alert("Ese archivo no es una copia de progreso válida.");
    }
  };
  reader.readAsText(file);
}

async function testServices() {
  const out = $("#testOut");
  const list = providers();
  out.innerHTML = list.map((p, i) => `<p id="svc${i}">⏳ ${esc(p.name)}</p>`).join("");
  await Promise.all(list.map(async (provider, i) => {
    const row = $("#svc" + i, out);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 30000);
    const start = Date.now();
    try {
      parseJSON(await provider.call('Devuelve exactamente {"ok":true}', controller.signal));
      row.textContent = "✅ " + provider.name + " · " + Math.round((Date.now() - start) / 1000) + " s";
    } catch (e) {
      row.textContent = "❌ " + provider.name + " · " + (e.status ? "error " + e.status : "sin respuesta");
    } finally {
      clearTimeout(timer);
    }
  }));
}

function openSettings() {
  const saved = storageGet(API_KEY_KEY) || "";
  const connected = !!storageGet(PUTER_KEY);
  openModal(`
    <h2>⚙️ Configuración</h2>
    <p class="muted">NEXUS funciona sin claves. Los temas que escribes se envían a servicios gratuitos de IA de terceros: no incluyas datos personales.</p>
    <button class="btn ghost full" id="testBtn">🩺 Probar conexión con las IAs</button>
    <div id="testOut"></div>
    <div class="row"><button class="btn blue" id="puterToggle">${connected ? "Desconectar Puter" : "Conectar cuenta gratuita (opcional)"}</button></div>
    <details style="margin-top:16px"><summary>Avanzado: usar mi propia clave de Gemini</summary>
    <form id="keyForm">
      <label for="keyInput">API Key de Gemini (opcional)</label>
      <input class="field" type="password" id="keyInput" autocomplete="off" value="${esc(saved)}">
      <label style="font-weight:500"><input type="checkbox" id="showKey"> Mostrar clave</label>
      <button class="btn full">Guardar clave</button>
    </form></details>
    <label>Copia de tu progreso</label>
    <div class="row">
      <button class="btn ghost" id="mExport">⬇️ Exportar</button>
      <button class="btn ghost" id="mImport">⬆️ Importar</button>
      <input type="file" id="mFile" accept=".json,application/json" class="hidden">
    </div>
    <div class="row">
      <button class="btn ghost" id="mClose">Cerrar</button>
      <button class="btn ghost" id="mReset">Borrar progreso</button>
    </div>`);
  $("#testBtn").onclick = testServices;
  if (!connected) loadPuter().catch(() => {});
  $("#puterToggle").onclick = e => {
    const button = e.currentTarget;
    if (connected) {
      storageRemove(PUTER_KEY);
      window.puter?.auth.signOut();
      return openSettings();
    }
    connectPuter().then(openSettings).catch(() => { button.textContent = "No se pudo conectar. Reintentar"; });
  };
  $("#showKey").onchange = e => { $("#keyInput").type = e.target.checked ? "text" : "password"; };
  $("#mClose").onclick = closeModal;
  $("#mExport").onclick = exportProgress;
  $("#mImport").onclick = () => $("#mFile").click();
  $("#mFile").onchange = e => { if (e.target.files[0]) importProgress(e.target.files[0]); };
  $("#keyForm").onsubmit = e => {
    e.preventDefault();
    const key = $("#keyInput").value.trim();
    if (key) storageSet(API_KEY_KEY, key);
    else storageRemove(API_KEY_KEY);
    closeModal();
  };
  $("#mReset").onclick = () => confirmModal("¿Borrar todo el progreso?", "Se eliminarán cursos, XP y racha. No se puede deshacer.", "Borrar todo", () => {
    state = defaultState();
    save();
    renderHome();
  });
}

/* ===================== Arranque ===================== */
$("#homeBtn").onclick = () => {
  if (session) confirmModal("¿Salir de la lección?", "Esta lección no se marcará como completada.", "Salir", renderHome);
  else renderHome();
};
$("#settingsBtn").onclick = openSettings;
$("#gemsBtn").onclick = openShop;
$("#livesBtn").onclick = openShop;
$("#streakBtn").onclick = openStreak;
// La racha se actualiza al volver a la pestaña o al cambiar de día.
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderStats(); });
setInterval(renderStats, 60000);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#mClose")) closeModal(); });
window.addEventListener("pagehide", stopSpeech);
window.addEventListener("storage", e => { if (e.key === STORE_KEY) { state = loadState(); session = null; renderHome(); } });
window.addEventListener("resize", drawLinks);
document.fonts?.ready.then(drawLinks);
if (canSpeak) window.speechSynthesis.getVoices();

renderHome();
</script>
